# Omarchy's tmux config, with this repo's pane navigation kept.
# https://omarchy.org/manual/hotkeys/ documents the Omarchy bindings.
# docs/omarchy-differences.md lists only where this file differs from them.

# ── Prefix ───────────────────────────────────────────────────────────────────
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# ── Config and help ──────────────────────────────────────────────────────────
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
# Omarchy shows its own cheatsheet here. list-keys -N prints the -N descriptions
# below, which is the portable equivalent.
bind -N "Show tmux keybindings" ? display-popup -E -w 80% -h 70% -T "tmux keybindings" "tmux list-keys -N | less -R"

# ── Copy mode ────────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send-keys -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Panes ────────────────────────────────────────────────────────────────────
# DIFFERS FROM OMARCHY: Omarchy splits with prefix h (below) and v (beside).
# Those letters are pane focus here, so splits stay on | and -.
bind -N "Split pane beside" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane below" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane beside" % split-window -h -c "#{pane_current_path}"
bind -N "Split pane below" '"' split-window -v -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

# DIFFERS FROM OMARCHY: vim-style pane focus and resize, which Omarchy does not
# bind at all.
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R

bind -N "Resize pane left" -r H resize-pane -L 5
bind -N "Resize pane down" -r J resize-pane -D 5
bind -N "Resize pane up" -r K resize-pane -U 5
bind -N "Resize pane right" -r L resize-pane -R 5

# Omarchy's no-prefix pane keys. Ctrl+Alt is free on macOS; Omarchy's
# Alt+Enter, Alt+Escape and Alt+digit keys are not, so they are left out.
bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane down" -n C-M-Down select-pane -D
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane right" -n C-M-Right select-pane -R

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# ── Windows ──────────────────────────────────────────────────────────────────
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
# DIFFERS FROM OMARCHY: Omarchy kills a window with prefix k, which is pane
# focus here. tmux's default & still works.
bind -N "Previous window" -r C-h select-window -t :-
bind -N "Next window" -r C-l select-window -t :+

# ── Sessions ─────────────────────────────────────────────────────────────────
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Next session" N switch-client -n
bind -N "Previous session" P switch-client -p

# ── General ──────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g mouse on
set -g detach-on-destroy off
setw -g aggressive-resize on

# Programs inside tmux reach the terminal directly. Ghostty's OSC sequences and
# clipboard writes need this.
set -g allow-passthrough on
set -g set-clipboard on

# Ghostty sends Shift+Enter and Alt+Shift+Enter as CSI-u. Without these two,
# tmux drops the distinction before a program sees it.
set -g extended-keys on
set -g extended-keys-format csi-u

# Give Escape and Alt key sequences enough time to arrive.
set -s escape-time 10

# TERM inside tmux describes tmux; terminal-features describes Ghostty outside it.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB:clipboard'
set -as terminal-features ',xterm-ghostty:RGB:clipboard'
set -as terminal-features ',*:clipboard'

setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# ── Status line ──────────────────────────────────────────────────────────────
# Named colours, not hex, so the status line follows the terminal palette.
# Changing the Ghostty theme re-themes tmux with no edit here.
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# 'theme set NAME' writes the two status-line colours that need to contrast
# with the accent rather than follow the palette. Missing file is fine.
source-file -q ~/.local/state/dotfiles-theme/tmux.conf
