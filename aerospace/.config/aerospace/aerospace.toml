# Stow target: ~/.config/aerospace/aerospace.toml
# Edit the symlinked file there, or edit this file in the repo directly

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
config-version = 2
after-startup-command = []

# Start AeroSpace at login
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Two banks of ten workspaces. They are intentionally not pinned to monitors yet.
persistent-workspaces = [
    'P0', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8', 'P9',
    'W0', 'W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', 'W8', 'W9',
    # Scratchpad. AeroSpace has no dropdown workspace, so S is an ordinary
    # workspace that Option+Backtick toggles in and out of.
    'S',
]

# --- App → Workspace rules ---
# Find app IDs with: `aerospace list-apps` or `mdls -name kMDItemCFBundleIdentifier -r /Applications/App.app`

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace W0'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace P1'

# ChatGPT → workspace W4
[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = 'move-node-to-workspace W4'

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        10
    outer.right =      10

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    # Omarchy's Super+T/F, translated to Option on macOS.
    alt-t = 'layout floating tiling'
    alt-f = 'fullscreen'
    # Option+Ctrl+; then F remains the fallback for apps that use Option+F.

    # Option+Arrow is deliberately unbound. macOS uses Option+Arrow to move the
    # caret by word and Option+Shift+Arrow to select by word, in every text
    # field and in readline. The vim-style keys below cover focus and move.

    # Focus within the workspace first, then hop monitors if we hit the edge.
    alt-h = 'exec-and-forget aerospace focus left --boundaries workspace --boundaries-action fail || aerospace focus-monitor left --wrap-around'
    alt-j = 'exec-and-forget aerospace focus down --boundaries workspace --boundaries-action fail || aerospace focus-monitor down --wrap-around'
    alt-k = 'exec-and-forget aerospace focus up --boundaries workspace --boundaries-action fail || aerospace focus-monitor up --wrap-around'
    alt-l = 'exec-and-forget aerospace focus right --boundaries workspace --boundaries-action fail || aerospace focus-monitor right --wrap-around'

    # Explicit monitor hops are more reliable than cross-monitor directional focus.
    alt-ctrl-h = 'focus-monitor left --wrap-around'
    alt-ctrl-j = 'focus-monitor down --wrap-around'
    alt-ctrl-k = 'focus-monitor up --wrap-around'
    alt-ctrl-l = 'focus-monitor right --wrap-around'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left --boundaries all-monitors-outer-frame'
    alt-shift-j = 'move down --boundaries all-monitors-outer-frame'
    alt-shift-k = 'move up --boundaries all-monitors-outer-frame'
    alt-shift-l = 'move right --boundaries all-monitors-outer-frame'

    # Send the focused window to another monitor and follow it there.
    alt-ctrl-shift-h = 'move-node-to-monitor left --focus-follows-window --wrap-around'
    alt-ctrl-shift-j = 'move-node-to-monitor down --focus-follows-window --wrap-around'
    alt-ctrl-shift-k = 'move-node-to-monitor up --focus-follows-window --wrap-around'
    alt-ctrl-shift-l = 'move-node-to-monitor right --focus-follows-window --wrap-around'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Switch within the current P/W workspace bank.
    alt-1 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" workspace 1'
    alt-2 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" workspace 2'
    cmd-alt-3 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" workspace 3'
    alt-4 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" workspace 4'
    alt-5 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" workspace 5'
    alt-6 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" workspace 6'
    alt-7 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" workspace 7'
    alt-8 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" workspace 8'
    alt-9 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" workspace 9'
    alt-0 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" workspace 0'

    # Move the focused window within the current P/W workspace bank.
    alt-shift-1 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" move 1'
    alt-shift-2 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" move 2'
    cmd-alt-shift-3 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" move 3'
    alt-shift-4 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" move 4'
    alt-shift-5 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" move 5'
    alt-shift-6 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" move 6'
    alt-shift-7 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" move 7'
    alt-shift-8 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" move 8'
    alt-shift-9 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" move 9'
    alt-shift-0 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" move 0'

    # Ctrl reaches the other bank, the way it reaches the other monitor on
    # H/J/K/L. Option+Ctrl+3 needs no Command escape: only plain Option+3
    # types '#' on a UK keyboard.
    alt-ctrl-1 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace 1'
    alt-ctrl-2 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace 2'
    alt-ctrl-3 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace 3'
    alt-ctrl-4 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace 4'
    alt-ctrl-5 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace 5'
    alt-ctrl-6 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace 6'
    alt-ctrl-7 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace 7'
    alt-ctrl-8 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace 8'
    alt-ctrl-9 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace 9'
    alt-ctrl-0 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace 0'

    # Send the focused window to the other bank and follow it there.
    alt-ctrl-shift-1 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move 1'
    alt-ctrl-shift-2 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move 2'
    alt-ctrl-shift-3 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move 3'
    alt-ctrl-shift-4 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move 4'
    alt-ctrl-shift-5 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move 5'
    alt-ctrl-shift-6 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move 6'
    alt-ctrl-shift-7 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move 7'
    alt-ctrl-shift-8 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move 8'
    alt-ctrl-shift-9 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move 9'
    alt-ctrl-shift-0 = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move 0'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Option+; crosses to the other bank, keeping the slot number. There are
    # only two banks, so one key is enough and no binding mode is needed.
    alt-semicolon = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other workspace'
    alt-shift-semicolon = 'exec-and-forget "$HOME/.config/aerospace/workspace-group" other move'
    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-ctrl-semicolon = 'mode service'

    # Omarchy's terminal and tmux terminal launchers, using Option as Super.
    alt-enter = 'exec-and-forget open -n -a Ghostty'
    alt-ctrl-enter = 'exec-and-forget "$HOME/.local/bin/ghostty" -e tmux new-session -A -s Work'
    alt-ctrl-t = 'exec-and-forget "$HOME/.local/bin/ghostty" -e btop'
    alt-shift-b = 'exec-and-forget open -a Firefox'
    alt-shift-f = 'exec-and-forget open -a Finder'
    alt-shift-n = 'exec-and-forget "$HOME/.local/bin/ghostty" -e nvim'
    alt-shift-d = 'exec-and-forget "$HOME/.local/bin/ghostty" -e lazydocker'
    alt-shift-a = 'exec-and-forget open -a ChatGPT'
    # Option+Shift+Enter stays unbound so Ghostty receives its own
    # alt+shift+enter=csi:13;4u binding. Option+Enter opens a window.

    # --- Omarchy's system panels (Super+Ctrl+letter) ---
    # macOS System Settings panes. These identifiers exist on macOS 15 and 26.
    alt-ctrl-a = 'exec-and-forget open "x-apple.systempreferences:com.apple.Sound-Settings.extension"'
    alt-ctrl-b = 'exec-and-forget open "x-apple.systempreferences:com.apple.BluetoothSettings"'
    alt-ctrl-w = 'exec-and-forget open "x-apple.systempreferences:com.apple.wifi-settings-extension"'
    alt-ctrl-d = 'exec-and-forget open "x-apple.systempreferences:com.apple.Displays-Settings.extension"'
    alt-ctrl-p = 'exec-and-forget open "x-apple.systempreferences:com.apple.Battery-Settings.extension"'
    alt-ctrl-q = 'exec-and-forget open -a Calculator'

    # Omarchy's Super+Ctrl+R. Prompts, because a window-manager key has no
    # terminal to type a duration into.
    alt-ctrl-r = 'exec-and-forget "$HOME/.local/bin/remind" ask'
    # DIFFERS FROM OMARCHY: Omarchy's notices are Super+Ctrl+Alt+T/B/W, which
    # cannot exist here because Option is already Super. Only weather gets a
    # key; the menu bar shows the clock and battery.
    alt-ctrl-shift-w = 'exec-and-forget "$HOME/.local/bin/notice" weather'

    # DIFFERS FROM OMARCHY: Omarchy cycles windows on a workspace with plain
    # Alt+Tab. Option+Tab is workspace-back-and-forth here, so cycling moves to
    # Option+Ctrl+Tab.
    alt-ctrl-tab = 'focus dfs-next'
    alt-ctrl-shift-tab = 'focus dfs-prev'

    # Omarchy's scratchpad (Super+S / Super+Grave). AeroSpace has no dropdown
    # workspace, so this toggles in and out of workspace S instead.
    alt-backtick = 'workspace --auto-back-and-forth S'
    alt-shift-backtick = 'move-node-to-workspace S'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
